name: Corpus checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  markdown:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install fixed knowledge engine
        run: python -m pip install 'mindie-knowledge @ git+https://github.com/mindie-agent/knowledge@0ef4cfa5be6f97c4a74f439ea931ba305f309f28'
      # Treat the checkout only as data; never import its Python modules.
      - name: Check Markdown and redaction
        run: python -I -m mindie_knowledge.corpus_check --repo "$GITHUB_WORKSPACE"
