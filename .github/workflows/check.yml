name: Corpus checks

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  checks: write

concurrency:
  group: corpus-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  publication:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # No candidate checkout: the PR supplies Git blobs, never executable code.
      # pull_request_target uses the trusted base; only the final step receives
      # a token, to attach its result to the validated head instead of the base SHA.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install reviewed validator
        id: install
        env:
          PIP_NO_INPUT: '1'
          PIP_RETRIES: '0'
          PIP_DEFAULT_TIMEOUT: '20'
          GIT_TERMINAL_PROMPT: '0'
        run: timeout 120s python -m pip install --disable-pip-version-check 'mindie-knowledge @ git+https://github.com/mindie-agent/knowledge@e0ee5ac46fe847728b2bf5b0a91f62c83d6ef688'
      - name: Validate exact publication head and PR text
        id: validate
        run: |
          python -I - <<'PY'
          import json
          import os
          from pathlib import Path
          import re
          import tempfile
          from mindie_knowledge.community.common import run_argv
          from mindie_knowledge.publication_check import validate
          from mindie_knowledge.redact import scan_text

          event = json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_text())
          if os.environ['GITHUB_EVENT_NAME'] == 'pull_request_target':
              pr = event['pull_request']
              if pr['base']['ref'] != 'main':
                  raise SystemExit('Only main is a publication target')
              expected = pr['head']['sha']
              number = event['number']
              if type(number) is not int or number <= 0:
                  raise SystemExit('Invalid PR number')
              ref = f'refs/pull/{number}/head'
              for key in ('title', 'body'):
                  value = pr.get(key) or ''
                  if not isinstance(value, str) or len(value.encode('utf-8')) > 131072:
                      raise SystemExit('PR text exceeds validation limits')
                  if scan_text(value):
                      raise SystemExit('PR text fails the privacy scan')
          else:
              expected = os.environ['GITHUB_SHA']
              ref = expected
          if not re.fullmatch(r'[0-9a-f]{40}', expected):
              raise SystemExit('Expected an immutable commit SHA')

          def git(repo, *args):
              result = run_argv(
                  ['git', '-C', str(repo), '-c', 'core.hooksPath=/dev/null', *args],
                  timeout=90, max_output=1048576, input_bytes=b'',
                  env={'GIT_TERMINAL_PROMPT': '0'},
              )
              if result.timed_out or result.code:
                  raise SystemExit('Bounded Git read failed; no automatic retry')
              return result.out.decode('utf-8').strip()

          with tempfile.TemporaryDirectory(prefix='mindie-publication-') as directory:
              repo = Path(directory)
              git(repo, 'init', '--bare', '--quiet')
              git(repo, 'fetch', '--no-tags', '--depth=1',
                  'https://github.com/mindie-agent/knowledge-vllm-ascend.git', ref)
              if git(repo, 'rev-parse', 'FETCH_HEAD') != expected:
                  raise SystemExit('PR head changed while fetching; stale result refused')
              print(json.dumps(validate(repo, expected, 'vllm-ascend'), sort_keys=True))
          PY
      - name: Publish result on the validated commit
        if: always() && !cancelled()
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLICATION_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          VALIDATION_OUTCOME: ${{ steps.validate.outcome }}
        run: |
          python -I - <<'PY'
          import json
          import os
          import re
          import urllib.error
          import urllib.request
          sha = os.environ['PUBLICATION_HEAD']
          if not re.fullmatch(r'[0-9a-f]{40}', sha):
              raise SystemExit('Invalid result commit')
          ok = all(os.environ[key] == 'success' for key in ('INSTALL_OUTCOME', 'VALIDATION_OUTCOME'))
          conclusion = 'success' if ok else 'failure'
          repository = 'mindie-agent/knowledge-vllm-ascend'
          payload = dict(
              name='publication-head', head_sha=sha, status='completed', conclusion=conclusion,
              details_url=f'https://github.com/{repository}/actions/runs/' + os.environ['GITHUB_RUN_ID'],
              output=dict(title='Publication validation', summary=f'{sha}: {conclusion}. Trusted validator e0ee5ac46fe847728b2bf5b0a91f62c83d6ef688.'),
          )
          request = urllib.request.Request(
              f'https://api.github.com/repos/{repository}/check-runs',
              data=json.dumps(payload).encode(), method='POST',
              headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                       'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'},
          )
          try:
              with urllib.request.urlopen(request, timeout=10) as response:
                  receipt = json.loads(response.read(65536))
          except urllib.error.HTTPError as exc:
              raise SystemExit(f'Check publication failed: HTTP {exc.code}; no automatic retry')
          if receipt.get('head_sha') != sha or receipt.get('conclusion') != conclusion:
              raise SystemExit('Check publication receipt mismatch')
          print(json.dumps({'head_sha': sha, 'conclusion': conclusion, 'check_id': receipt['id']}))
          PY
